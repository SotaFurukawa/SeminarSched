# 必要な項目だけを変更し、
# %LOCALAPPDATA%\SummerScheduler\config.yaml へコピーして使用します。
application:
  name: "夏期講習 時間割作成"
  organization_name: "SummerScheduler"

storage:
  # nullの場合は %LOCALAPPDATA%\SummerScheduler\data を使用します。
  data_directory: null
  database_filename: "summer_scheduler.db"

logging:
  # nullの場合は %LOCALAPPDATA%\SummerScheduler\logs を使用します。
  directory: null
  filename: "summer_scheduler.log"
  level: "INFO"
  max_bytes: 5242880
  backup_count: 5

backup:
  # 自動バックアップにもプロジェクトと同じ個人情報が含まれます。
  automatic_generations: 5
  automatic_interval_minutes: 5

optimization:
  # fast / standard / high_quality
  default_preset: "standard"
  fast_time_limit_seconds: 30
  standard_time_limit_seconds: 120
  high_quality_time_limit_seconds: 600
  # 同じ入力・同じseedでの再現性を優先し、既定は1 workerとします。
  random_seed: 20260729
  num_search_workers: 1
  # 通常担当の優先度1～4、第1～第3希望講師の段階内スコアです。
  regular_teacher_priority_weights: [1, 3, 6, 10]
  preferred_teacher_rank_weights: [9, 6, 3]
  student_preferred_time_weight: 1
  teacher_preferred_time_weight: 1
  preserve_existing_assignment_weight: 1
  # 任意の第6段階は0で無効。後から非負整数へ変更できます。
  optional_balance_weight: 0

output:
  # A3 / A4、landscape（横）/ portrait（縦）
  paper_size: "A3"
  orientation: "landscape"
  # 表示順もこの一覧で保持します。
  visible_fields:
    - "grade"
    - "group"
    - "locked"
    - "manual"
    - "note"
    - "one_to_one"
    - "subject"
    - "warning"
  days_per_page: 2
  teacher_columns_per_page: 8
  font_size: 8.0
  margin_mm: 8.0
  # 使用可能な置換項目: {project} / {report} / {date}
  file_name_pattern: "{report}"
  # nullの場合は保存ダイアログで選択します。相対パスはこの設定ファイル基準です。
  default_output_directory: null
  # one_per_page / combined
  student_page_mode: "one_per_page"
  # trueはExcelで開きやすいUTF-8 BOM付きCSVです。
  csv_with_bom: true
  # 色だけでなくmarkerを必ず併記し、モノクロ印刷でも識別可能にします。
  style_rules:
    one_to_one:
      label: "1対1"
      marker: "[1対1]"
      fill_color: "#FFF1CC"
      text_color: "#18212F"
    group:
      label: "集団授業"
      marker: "[集団]"
      fill_color: "#303846"
      text_color: "#FFFFFF"
    locked:
      label: "ロック"
      marker: "[固定]"
      fill_color: "#DCEBFF"
      text_color: "#18212F"
    warning:
      label: "警告"
      marker: "[警告]"
      fill_color: "#FFE0E0"
      text_color: "#18212F"
    unconfirmed:
      label: "未確定"
      marker: "[未確定]"
      fill_color: "#E8E8E8"
      text_color: "#18212F"
    manual:
      label: "手動変更"
      marker: "[手]"
      fill_color: "#EADFFF"
      text_color: "#18212F"
    closed:
      label: "休校"
      marker: "[休校]"
      fill_color: "#333333"
      text_color: "#FFFFFF"
