[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "summer-course-scheduler"
version = "1.3.1"
description = "夏期講習などの個別指導時間割を作成するWindows向けローカルデスクトップアプリ"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "alembic>=1.14,<2",
    "openpyxl>=3.1,<4",
    "ortools==9.14.6206",
    "platformdirs>=4.3,<5",
    "PySide6>=6.8,<7",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "Nuitka==4.0",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "types-openpyxl>=3.1.5.20240630,<4",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
summer-scheduler = "summer_scheduler.__main__:main"

[project.urls]
Homepage = "https://github.com/SotaFurukawa/SeminarSched"
Repository = "https://github.com/SotaFurukawa/SeminarSched"
Issues = "https://github.com/SotaFurukawa/SeminarSched/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["summer_scheduler*"]
namespaces = true

[tool.setuptools.package-data]
summer_scheduler = [
    "ui/qml/*.qml",
    "**/*.qml",
    "resources/*.yaml",
    "resources/*.yml",
    "**/*.yaml",
    "**/*.yml",
    "infrastructure/db/alembic/*.ini",
    "infrastructure/db/alembic/*.mako",
    "infrastructure/db/alembic/*.py",
    "infrastructure/db/alembic/versions/*.py",
    "**/alembic.ini",
    "**/script.py.mako",
    "**/migrations/*.py",
    "**/migrations/versions/*.py",
]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"src/**/alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
    "^build/",
    "^dist/",
    "^src/summer_scheduler/infrastructure/db/alembic/versions/",
]
